[project]
name = "caught"
version = "0.1.0"
description = "A desk camera that learns your bad habits and shows you the chart."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "mediapipe==0.10.21",
    "numpy<2",
    "opencv-python<4.13",
    "pillow>=12.3.0",
    "rumps>=0.4.0",
    "torch>=2.14.0",
    "ultralytics>=8.4.152",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
caught = "caught:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
